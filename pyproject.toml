[project]
name = "mt4-executor"
version = "0.1.0"
description = "Standalone autonomous MT4 trade-execution connector built on MetaApi.cloud"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "metaapi-cloud-sdk>=29,<30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mt4-executor = "mt4_executor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt4_executor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
